name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc pins legacy-peer-deps to work around an npm 10.9 arborist bug on
      # the vitest 4 peer graph; see the comment in that file.
      - name: Install
        run: npm ci

      - name: Typecheck (worker + client)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build client bundle
        run: npm run build:client

      - name: Enforce performance budget
        run: npm run check:budget

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build client bundle
        run: npm run build:client

      - name: Apply D1 migrations
        run: node scripts/migrate.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fail the deploy if the live site is not actually healthy afterwards.
      - name: Smoke test
        run: |
          set -euo pipefail
          BASE="${{ vars.SITE_URL || 'https://vestiq.prakhargupta267.workers.dev' }}"

          echo "→ /health"
          STATUS=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$BASE/health")
          cat /tmp/health.json
          test "$STATUS" = "200"
          grep -q '"status":"healthy"' /tmp/health.json

          echo "→ / (must server-render)"
          curl -sS --max-time 30 "$BASE/" | grep -q 'action="/search"'

          echo "→ /search (must return results server-side)"
          curl -sS --max-time 60 "$BASE/search?q=cotton+kurta" | grep -q 'class="grid"'

          echo "→ /robots.txt"
          curl -sS --max-time 30 "$BASE/robots.txt" | grep -q 'Sitemap:'

          echo "All smoke checks passed."
