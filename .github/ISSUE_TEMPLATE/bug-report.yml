name: Product problem
description: Report a reproducible problem in the public Vestiq demo.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the public catalogue pilot. Do not include private contact, account, or order information.
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://vestiq.prakhargupta267.workers.dev/search?q=outdoor
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 140, Android
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, payment and order information from this report.
          required: true
